apiVersion: batch/v1
kind: Job
metadata:
  name: reasons-service-migrate
  labels:
    app: reasons-service
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: reasons-service:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: reasons-service-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

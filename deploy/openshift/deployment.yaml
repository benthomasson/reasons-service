apiVersion: apps/v1
kind: Deployment
metadata:
  name: reasons-service
  labels:
    app: reasons-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reasons-service
  template:
    metadata:
      labels:
        app: reasons-service
    spec:
      containers:
        - name: reasons-service
          image: ghcr.io/benthomasson/reasons-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: reasons-service-config
            - secretRef:
                name: reasons-service-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
